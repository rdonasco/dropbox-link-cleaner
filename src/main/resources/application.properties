# Dropbox access token is resolved from this property, which by default reads the environment variable.
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:}

# Dropbox API base URL (defaults to official API v2), overridable via env var DROPBOX_API_BASE_URL
# Example override: export DROPBOX_API_BASE_URL=https://api.dropboxapi.com/2
# or command line: -Ddropbox.api-base-url=https://api.dropboxapi.com/2
dropbox.api-base-url=${DROPBOX_API_BASE_URL:https://api.dropboxapi.com/2}
